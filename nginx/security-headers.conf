# Included in every location: nginx does not inherit add_header
# from the server block into a location that defines its own add_header.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# style-src 'unsafe-inline': react-activity-calendar injects a <style> tag at runtime
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://github-contributions-api.jogruber.de; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
